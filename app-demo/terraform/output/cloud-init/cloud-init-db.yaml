#cloud-config
# Cloud-init per il nodo database (PostgreSQL)
# Variabili template: db_user, db_password, db_name, subnet_cidr

package_update: true
packages:
  - postgresql
  - postgresql-contrib

runcmd:
  # Configura PostgreSQL per accettare connessioni remote
  - sudo -u postgres psql -c "CREATE USER ${db_user} WITH PASSWORD '${db_password}';"
  - sudo -u postgres psql -c "CREATE DATABASE ${db_name} OWNER ${db_user};"
  - sudo -u postgres psql -c "GRANT ALL PRIVILEGES ON DATABASE ${db_name} TO ${db_user};"
  # Permetti all'utente di creare oggetti nello schema public
  - sudo -u postgres psql -d ${db_name} -c "GRANT ALL ON SCHEMA public TO ${db_user};"
  # Configura ascolto su tutte le interfacce
  - sed -i "s/#listen_addresses = 'localhost'/listen_addresses = '*'/" /etc/postgresql/*/main/postgresql.conf
  # Configura pg_hba.conf per la subnet privata
  - echo "host all all ${subnet_cidr} md5" >> /etc/postgresql/*/main/pg_hba.conf
  # Riavvia PostgreSQL per applicare le modifiche
  - systemctl restart postgresql
