#cloud-config
# Cloud-init per il nodo frontend (Nginx)
# Variabile template: node_index

package_update: true
packages:
  - nginx

write_files:
  - path: /var/www/html/index.html
    content: |
      <!DOCTYPE html>
      <html>
      <head><title>Hotel App - Frontend ${node_index}</title></head>
      <body>
        <h1>Frontend node ${node_index}</h1>
        <p>Hotel application frontend server.</p>
      </body>
      </html>

runcmd:
  - systemctl enable nginx
  - systemctl start nginx
